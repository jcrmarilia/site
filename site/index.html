<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JCR Marília · Links</title>
<meta name="description" content="JCR Marília — horários dos cultos, como chegar, cadastro de visitantes, WhatsApp e redes sociais.">
<meta name="theme-color" content="#04060c">
<meta property="og:type" content="website">
<meta property="og:title" content="JCR Marília">
<meta property="og:description" content="Horários, localização, cadastro de visitantes e redes sociais da JCR Marília.">
<meta property="og:url" content="https://jcrmarilia.netlify.app/">
<meta property="og:image" content="https://jcrmarilia.netlify.app/assets/og.png">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Roboto:wght@400;500&family=Urbanist:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/jcr.css">
<script>document.documentElement.classList.add('js')</script>
<style>
html{background:var(--preto)}
body{min-height:100svh;background:radial-gradient(90% 55% at 50% 0%,rgba(21,84,200,.5),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(10,61,145,.35),transparent 70%),var(--preto)}
.bio{width:min(100% - 2rem,480px);margin:0 auto;padding:calc(34px + env(safe-area-inset-top)) 0 calc(30px + env(safe-area-inset-bottom));text-align:center}
.bio .selo{width:210px;margin-bottom:8px}
.bio .selo svg.anel text{font-size:19px}
.bio h1{font-weight:800;font-size:2.2rem;letter-spacing:-.02em;margin-top:6px}
.bio .sub{color:var(--texto-2);margin:6px 0 22px}
.prox-bio{display:flex;align-items:center;gap:14px;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px 18px;margin-bottom:14px;color:#fff;text-decoration:none}
.prox-bio .ponto{flex:none;width:10px;height:10px;border-radius:50%;background:var(--azul-brilho);animation:pulso 2s infinite}
.prox-bio small{display:block;font-family:var(--selo);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--azul-brilho);font-size:.72rem}
.links{display:grid;gap:12px}
.lk{position:relative;display:flex;align-items:center;gap:14px;padding:17px 20px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#fff;text-decoration:none;font-weight:600;text-align:left;overflow:hidden;transition:transform .25s var(--entrada),border-color .3s,color .3s}
.lk::before{content:"";position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .4s var(--entrada);z-index:-1}
.lk{isolation:isolate}
.lk:hover{color:var(--tinta);transform:translateY(-2px);border-color:#fff}
.lk:hover::before{transform:scaleX(1)}
.lk .ico{width:22px;height:22px;color:var(--azul-brilho);transition:transform .2s linear}
.lk:hover .ico{transform:rotate(-12deg);color:var(--azul)}
.lk span{flex:1}
.lk small{display:block;font-weight:400;font-family:var(--lista);color:var(--texto-2);font-size:.85rem}
.lk:hover small{color:var(--tinta-2)}
.lk .seta{color:var(--texto-2)}
.lk.dest{background:linear-gradient(121deg,var(--azul-2),#000 50%,var(--azul-brilho));background-size:300% 300%;animation:degrade 30s ease infinite;border-color:rgba(255,255,255,.18)}
html.js .lk.dest.visivel{animation:sobe 1.1s var(--entrada) both,degrade 30s ease infinite}
.lk.dest small{color:#dbe6f7}
.bio .sociais{justify-content:center;margin:26px 0 8px}
.bio .verso{font-weight:600;color:#d5deeb;font-size:1.02rem;margin:22px 8px 0;line-height:1.5}
.bio .verso span{display:block;font-family:var(--selo);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--azul-brilho);font-size:.75rem;margin-top:6px}
.bio .rod{color:var(--texto-2);font-size:.82rem;margin-top:18px}
.bio .rod a{color:#fff}
</style>
</head>
<body>
<main class="bio">
  <div class="selo" id="selo" data-anima="zoom"></div>
  <h1 data-anima="sobe">JCR <span class="metal">Marília</span></h1>
  <p class="sub" id="sub" data-anima="sobe" data-atraso="80"></p>
  <div id="prox" data-anima="sobe" data-atraso="140"></div>
  <nav class="links" id="links" aria-label="Links da JCR Marília"></nav>
  <div class="sociais" id="sociais"></div>
  <p class="verso" id="verso" data-anima="surge"></p>
  <p class="rod">jcrmarilia.netlify.app · <a href="/paginainicial">site completo</a></p>
</main>
<script src="/assets/igreja.js"></script>
<script src="/assets/comum.js"></script>
<script>
(function(){
  const J=JCR, {I, esc, ic, redesAtivas, linkMaps, linkWa, proximosCultos, rotuloQuando, eventosFuturos} = J;
  const $ = s => document.querySelector(s);
  $('#sub').textContent = I.lema;
  const palavras = (I.palavrasSelo||[]).join(' • ') + ' • ';
  $('#selo').innerHTML = `<svg class="anel" viewBox="0 0 400 400" aria-hidden="true"><defs><path id="circulo" d="M200,200 m-182,0 a182,182 0 1,1 364,0 a182,182 0 1,1 -364,0"/></defs><text textLength="1140" lengthAdjust="spacing"><textPath href="#circulo" textLength="1140" lengthAdjust="spacing">${esc(palavras)}</textPath></text></svg><img class="logo-centro" src="/assets/logo-jcr-320.webp" alt="Logo JCR - Jesus Cristo é a Resposta" width="320" height="320">`;
  const p = proximosCultos(1)[0];
  if(p) $('#prox').innerHTML = `<a class="prox-bio" href="/paginainicial#programacao"><span class="ponto"></span><div><small>Próximo culto</small><b>${esc(rotuloQuando(p))}</b> · ${esc(p.nome)}</div></a>`;
  const temEnd = !!(I.endereco && (I.endereco.rua || I.endereco.mapa));
  const evs = eventosFuturos();
  let n=0;
  const item = (href, icone, titulo, sub, cls='', ext=false) => `<a class="lk ${cls}" href="${href}" ${ext?'target="_blank" rel="noopener"':''} data-anima="sobe" data-atraso="${200+(n++)*70}">${ic(icone)}<span>${esc(titulo)}${sub?`<small>${esc(sub)}</small>`:''}</span>${ic('next','seta')}</a>`;
  let h = '';
  h += item('/cadastro','user','Sou visitante','Faça seu cadastro em 2 minutos','dest');
  h += item('/paginainicial#programacao','clock','Horários dos cultos','Programação da semana');
  h += temEnd ? item(linkMaps(),'pin','Como chegar','Abrir no mapa','',true) : item('/paginainicial#localizacao','pin','Como chegar','Endereço e mapa');
  if(evs.length) h += item('/paginainicial#agenda','cal','Agenda de eventos', evs[0].titulo);
  if(I.whatsapp) h += item(linkWa(),'whatsapp','Fale com a gente','WhatsApp da igreja','',true);
  if(I.redes.youtube) h += item(I.redes.youtube,'youtube','Cultos no YouTube','Assista e inscreva-se','',true);
  if(I.contribuicao && (I.contribuicao.pix||I.contribuicao.banco)) h += item('/paginainicial#contribua','heart','Dízimos e ofertas','PIX e dados bancários');
  h += item('/paginainicial','home','Conheça a JCR Marília','Site completo da igreja');
  $('#links').innerHTML = h;
  $('#sociais').innerHTML = redesAtivas().map(r=>`<a href="${esc(r.u)}" target="_blank" rel="noopener" aria-label="${esc(r.nome)}">${ic(r.k)}</a>`).join('');
  $('#verso').innerHTML = `“${esc(I.versiculo.texto)}”<span>${esc(I.versiculo.ref)}</span>`;
  J.animar();
})();
</script>
</body>
</html>
