<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JCR Marília · Links</title>
<meta name="description" content="JCR Marília — horários dos cultos, como chegar, cadastro de visitantes, WhatsApp e redes sociais.">
<meta name="theme-color" content="#142d50">
<meta property="og:type" content="website">
<meta property="og:title" content="JCR Marília">
<meta property="og:description" content="Horários, localização, cadastro de visitantes e redes sociais da JCR Marília.">
<meta property="og:url" content="https://jcrmarilia.netlify.app/">
<meta property="og:image" content="https://jcrmarilia.netlify.app/assets/og.png">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/jcr.css">
<style>
html{background:#0b1b35}
body{background:radial-gradient(130% 60% at 50% 0%,#2a5287 0%,var(--navy) 45%,#0b1b35 100%) no-repeat;background-color:#0b1b35;min-height:100vh;color:#fff}
.bio{width:min(100% - 2rem,460px);margin:0 auto;padding:calc(42px + env(safe-area-inset-top)) 0 calc(36px + env(safe-area-inset-bottom));text-align:center}
.bio .logo{width:84px;height:84px;border-radius:26px;font-size:1.7rem;background:#fff;color:var(--navy);box-shadow:inset 0 -5px 0 var(--gold),0 10px 30px rgba(0,0,0,.25)}
.bio h1{font-family:var(--serif);font-weight:700;font-size:2.1rem;margin:16px 0 4px;letter-spacing:-.02em}
.bio .sub{color:#c8d6ea;margin:0 0 20px;font-size:.98rem}
.prox{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px 16px;margin-bottom:16px;color:#fff;text-decoration:none}
.prox .ico{width:26px;height:26px;color:var(--gold)}
.prox small{display:block;color:#b9cae2;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.prox b{font-size:1.05rem}
.links{display:grid;gap:11px}
.lk{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:16px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700;text-align:left;transition:transform .12s;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.lk:hover{transform:translateY(-2px)}
.lk .ico{width:22px;height:22px;color:var(--navy)}
.lk span{flex:1}
.lk small{display:block;font-weight:500;color:var(--muted);font-size:.82rem}
.lk .seta{width:18px;height:18px;color:#9aa8bb}
.lk.dest{background:var(--gold);color:#1b1405}
.lk.dest .ico,.lk.dest .seta{color:#1b1405}
.lk.dest small{color:#4a3910}
.lk.wa .ico{color:var(--wa)}
.sociais{display:flex;justify-content:center;gap:10px;margin:24px 0 10px}
.sociais a{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff}
.sociais .ico{width:22px;height:22px}
.rod{color:#8fa6c6;font-size:.82rem;margin-top:18px}
.rod a{color:#c8d6ea}
.verso{font-family:var(--serif);font-style:italic;color:#d5e1f1;font-size:1.02rem;margin:22px 8px 0;line-height:1.45}
.verso span{display:block;font-family:var(--sans);font-style:normal;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-top:6px;font-weight:800}
</style>
</head>
<body>
<main class="bio">
  <span class="logo">JCR</span>
  <h1>JCR Marília</h1>
  <p class="sub" id="sub">Jesus Cristo é a Resposta</p>
  <div id="prox"></div>
  <nav class="links" id="links" aria-label="Links da JCR Marília"></nav>
  <div class="sociais" id="sociais"></div>
  <p class="verso" id="verso"></p>
  <p class="rod">jcrmarilia.netlify.app · <a href="/paginainicial">site completo</a></p>
</main>
<script src="/assets/igreja.js"></script>
<script src="/assets/comum.js"></script>
<script>
(function(){
  const {I, esc, ic, redesAtivas, linkMaps, linkWa, proximosCultos, rotuloQuando, eventosFuturos} = JCR;
  const $ = s => document.querySelector(s);
  $('#sub').textContent = I.lema;
  const p = proximosCultos(1)[0];
  if(p) $('#prox').innerHTML = `<a class="prox" href="/paginainicial#programacao">${ic('clock')}<div><small>Próximo culto</small><b>${esc(rotuloQuando(p))}</b> · ${esc(p.nome)}</div></a>`;
  const temEnd = !!(I.endereco && (I.endereco.rua || I.endereco.mapa));
  const evs = eventosFuturos();
  const item = (href, icone, titulo, sub, cls='', ext=false) => `<a class="lk ${cls}" href="${href}" ${ext?'target="_blank" rel="noopener"':''}>${ic(icone)}<span>${esc(titulo)}${sub?`<small>${esc(sub)}</small>`:''}</span>${ic('next','seta')}</a>`;
  let h = '';
  h += item('/cadastro','user','Sou visitante','Faça seu cadastro em 2 minutos','dest');
  h += item('/paginainicial#programacao','clock','Horários dos cultos','Programação da semana');
  h += temEnd ? item(linkMaps(),'pin','Como chegar','Abrir no mapa','',true) : item('/paginainicial#localizacao','pin','Como chegar','Endereço e mapa');
  if(evs.length) h += item('/paginainicial#agenda','cal','Agenda de eventos', evs[0].titulo);
  if(I.whatsapp) h += item(linkWa(),'whatsapp','Fale com a gente','WhatsApp da igreja','wa',true);
  if(I.redes.youtube) h += item(I.redes.youtube,'youtube','Cultos no YouTube','Assista e inscreva-se','',true);
  if(I.contribuicao && (I.contribuicao.pix||I.contribuicao.banco)) h += item('/paginainicial#contribua','heart','Dízimos e ofertas','PIX e dados bancários');
  h += item('/paginainicial','home','Conheça a JCR Marília','Site completo da igreja');
  $('#links').innerHTML = h;
  $('#sociais').innerHTML = redesAtivas().map(r=>`<a href="${esc(r.u)}" target="_blank" rel="noopener" aria-label="${esc(r.nome)}">${ic(r.k)}</a>`).join('');
  $('#verso').innerHTML = `“${esc(I.versiculo.texto)}”<span>${esc(I.versiculo.ref)}</span>`;
})();
</script>
</body>
</html>
