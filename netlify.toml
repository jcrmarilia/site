# Netlify — publica a pasta "site" e a API (netlify/functions) a cada atualização no GitHub.
# O painel já vai compilado em site/gestao e site/testes (fonte em app/, compilar com: cd app && npm run build).
[build]
  publish = "site"
  command = ""

# ---------- Funções (API da plataforma) ----------
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["shared/**"]

# ---------- Endereços ----------
[[redirects]]
  from = "/bio"
  to = "/"
  status = 200

[[redirects]]
  from = "/inicio"
  to = "/paginainicial"
  status = 301

[[redirects]]
  from = "/avaliacoes"
  to = "/gestao/#avaliacoes"
  status = 302

# Painel (aplicativo de página única): qualquer endereço dentro de /gestao e /testes abre o painel
[[redirects]]
  from = "/gestao/*"
  to = "/gestao/index.html"
  status = 200

[[redirects]]
  from = "/testes/*"
  to = "/testes/index.html"
  status = 200

[[redirects]]
  from = "/hub/*"
  to = "/hub/index.html"
  status = 200

# ---------- Cabeçalhos ----------
[[headers]]
  for = "/gestao/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/testes/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/hub/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/igreja.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
